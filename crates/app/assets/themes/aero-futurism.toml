# Aero-Futurism: Frutiger Aero glossy translucency meets cyber futuristic neon.
# Specially crafted for transparent wallpaper backdrops with cyan/emerald glowing accents.

name = "Aero-Futurism"
icons = "color"
icon-set = "aero"

[controls]
field-focus = "border"
check = "aero"
button = "aero"
progress = "gloss"
scroll = "overlay"
caption = "aero"
focus = "ring"

[sizes]
radius = 6
"radius.button" = 7
"radius.part" = 4
"radius.check" = 3
"radius.flyout" = 8
"radius.menu-item" = 4
"radius.popup" = 8
"radius.egui" = 6
border = 1
"focus-line" = 2
"list.row" = 20
"list.header" = 26

[seeds.light]
background = "#eef7fc"
surface = "#ffffff"
header = "#e1f0fa"
text = "#0a192f"
accent = "#0284c7"
selection = "#bae6fd"
error = "#e11d48"
warning = "#d97706"
success = "#059669"

[seeds.dark]
