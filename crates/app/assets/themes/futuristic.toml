# Futuristic: Mister Download Manager's sci-fi / cyberpunk HUD theme.
# Inspired by high-contrast telemetry terminals, avionics displays, and cyberpunk interfaces.
# Features obsidian canvas, neon cyan accent, crisp angular geometry, and high-visibility segment bars.

name = "Futuristic"
icons = "mono"
icon-set = "metro"

[controls]
field-focus = "border"
check = "square"
button = "fluent"
progress = "bar"
scroll = "overlay"
caption = "metro"
focus = "frame"

[sizes]
radius = 2
"radius.button" = 2
"radius.part" = 1
"radius.check" = 1
"radius.flyout" = 4
"radius.menu-item" = 2
"radius.egui" = 2
"radius.popup" = 4
border = 1
"focus-line" = 2
"list.row" = 20
"list.header" = 26

[seeds.light]
background = "#f4f7fb"
surface = "#ffffff"
header = "#e8eef7"
text = "#0b132b"
accent = "#0077b6"
selection = "#005580"
error = "#d00000"
warning = "#e85d04"
success = "#007f5f"

[seeds.dark]
background = "#080c14"
surface = "#0d1524"
header = "#0a101d"
text = "#e2f1ff"
accent = "#00f0ff"
selection = "#005f73"
error = "#ff0055"
warning = "#ffb703"
success = "#00ff9d"

