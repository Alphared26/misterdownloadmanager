# Steampunk: Victorian industrial brass, copper bevels, and warm vacuum-tube amber glow.
# Ideal for mechanical, fantasy, and vintage wallpaper aesthetics.

name = "Steampunk"
icons = "color"
icon-set = "luna"

[controls]
field-focus = "border"
check = "square"
button = "luna"
progress = "gloss"
scroll = "classic"
caption = "luna"
focus = "dotted"

[sizes]
radius = 3
"radius.button" = 4
"radius.part" = 2
"radius.check" = 1
"radius.flyout" = 4
"radius.menu-item" = 3
"radius.popup" = 4
"radius.egui" = 3
border = 1
"focus-line" = 1
"list.row" = 20
"list.header" = 26

